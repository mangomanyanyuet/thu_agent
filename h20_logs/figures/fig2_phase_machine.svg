<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="430" viewBox="0 0 1060 430">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#666"/></marker><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b03a3a"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2f8a55"/></marker></defs>
<style>text{font-family:Hiragino Sans GB, STHeiti Medium, STHeiti, PingFang SC, Arial Unicode MS, sans-serif}</style>
<rect width="1060" height="430" fill="#ffffff"/>
<text x="28" y="34" font-size="20" font-weight="700" fill="#111">图 2 · 陪伴会话相位状态机（含触发条件与实测到达次数）</text>
<rect x="45.0" y="122.0" width="130.0" height="56.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="110.0" y="140.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">consent</text><text x="110.0" y="159.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">知情同意</text>
<text x="110.0" y="200.0" text-anchor="middle" font-size="11" fill="#777">6 次</text>
<rect x="205.0" y="122.0" width="130.0" height="56.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="270.0" y="140.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">quality</text><text x="270.0" y="159.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">质量前置</text>
<text x="270.0" y="200.0" text-anchor="middle" font-size="11" fill="#777">6 次</text>
<rect x="365.0" y="122.0" width="130.0" height="56.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="430.0" y="140.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">opening</text><text x="430.0" y="159.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">开场白</text>
<text x="430.0" y="200.0" text-anchor="middle" font-size="11" fill="#777">6 次</text>
<rect x="525.0" y="122.0" width="130.0" height="56.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="590.0" y="140.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">main</text><text x="590.0" y="159.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">主体对话</text>
<text x="590.0" y="200.0" text-anchor="middle" font-size="11" fill="#777">5 次</text>
<rect x="685.0" y="122.0" width="130.0" height="56.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="750.0" y="140.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">closing</text><text x="750.0" y="159.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">收尾</text>
<text x="750.0" y="200.0" text-anchor="middle" font-size="11" fill="#777">4 次</text>
<rect x="845.0" y="122.0" width="130.0" height="56.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="910.0" y="140.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">done</text><text x="910.0" y="159.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">完成</text>
<text x="910.0" y="200.0" text-anchor="middle" font-size="11" fill="#777">1 次</text>
<line x1="175.0" y1="150.0" x2="205.0" y2="150.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="190.0" y="138.0" text-anchor="middle" font-size="10.5" fill="#666">三项同意全勾选</text>
<line x1="335.0" y1="150.0" x2="365.0" y2="150.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="350.0" y="138.0" text-anchor="middle" font-size="10.5" fill="#666">质检完成</text>
<line x1="495.0" y1="150.0" x2="525.0" y2="150.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="510.0" y="138.0" text-anchor="middle" font-size="10.5" fill="#666">收到第 1 轮</text>
<line x1="655.0" y1="150.0" x2="685.0" y2="150.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="670.0" y="138.0" text-anchor="middle" font-size="10.5" fill="#666">轮次&lt;4 且 &lt;240s</text>
<line x1="815.0" y1="150.0" x2="845.0" y2="150.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="830.0" y="138.0" text-anchor="middle" font-size="10.5" fill="#666">轮次≥4 或 ≥240s</text>
<line x1="590.0" y1="178.0" x2="590.0" y2="268.0" stroke="#b03a3a" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="6 4"/>
<rect x="495.0" y="274.0" width="190.0" height="62.0" rx="9" fill="#fdeaea" stroke="#b03a3a" stroke-width="1.5"/><text x="590.0" y="295.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">crisis</text><text x="590.0" y="314.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">任意阶段 risk=high</text>
<text x="590.0" y="353.0" text-anchor="middle" font-size="11" fill="#777">实测 2 次</text>
<text x="695.0" y="310.0" font-size="11" fill="#b03a3a">（短路：不再生成、不再推进 main）</text>
<text x="40.0" y="380.0" text-anchor="start" font-size="11" fill="#777">说明：CRISIS 由 engine.respond() 直接返回，不写 tracer.phase，因此 [trace] 的 phase.transition 里看不到它，</text>
<text x="40.0" y="394.0" text-anchor="start" font-size="11" fill="#777">但返回给前端的 phase 字段为 crisis，前端据此自动调用 /finish。</text>
<text x="40.0" y="408.0" text-anchor="start" font-size="11" fill="#777">M1 / M2 / V1 均未调用 /finish，会话数据未落库（M2、V1 停在 closing/done 之前）。</text>
</svg>