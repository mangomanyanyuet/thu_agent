<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#666"/></marker><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b03a3a"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2f8a55"/></marker></defs>
<style>text{font-family:Hiragino Sans GB, STHeiti Medium, STHeiti, PingFang SC, Arial Unicode MS, sans-serif}</style>
<rect width="1120" height="780" fill="#ffffff"/>
<text x="28" y="34" font-size="20" font-weight="700" fill="#111">图 1 · 对话内容如何驱动状态转移（Qwen3.5-4B 实测）</text>
<rect x="410.0" y="60.0" width="300.0" height="56.0" rx="9" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5"/><text x="560.0" y="78.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">用户一轮输入</text><text x="560.0" y="97.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">文本 + 语音 + 面部（本环境后两者恒空）</text>
<text x="730.0" y="78.0" text-anchor="start" font-size="11" fill="#a00">实测：h20 无摄像头/麦克风，</text>
<text x="730.0" y="92.0" text-anchor="start" font-size="11" fill="#a00">语音与面部通道恒为 none</text>
<line x1="500.0" y1="116.0" x2="300.0" y2="168.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="620.0" y1="116.0" x2="820.0" y2="168.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="140.0" y="169.0" width="320.0" height="62.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="300.0" y="190.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">① 情绪通道</text><text x="300.0" y="209.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">complete() 并要求输出 &lt;emotion&gt; 标签</text>
<rect x="660.0" y="169.0" width="320.0" height="62.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="820.0" y="190.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">② 风险通道</text><text x="820.0" y="209.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">规则词表 + structured(RiskAssessment) + 多模态</text>
<line x1="300.0" y1="231.0" x2="300.0" y2="288.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="820.0" y1="231.0" x2="820.0" y2="288.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="140.0" y="289.0" width="320.0" height="62.0" rx="9" fill="#e6f6ec" stroke="#2f8a55" stroke-width="1.5"/><text x="300.0" y="310.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">情绪标签 → 三通道融合</text><text x="300.0" y="329.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">→ 写轮次记录 / 报告 / 日报</text>
<rect x="660.0" y="289.0" width="320.0" height="62.0" rx="9" fill="#e6f6ec" stroke="#2f8a55" stroke-width="1.5"/><text x="820.0" y="310.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">risk_lvl = none / watch / high</text><text x="820.0" y="329.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">（取三通道最大值，只升不降）</text>
<text x="150.0" y="372.0" text-anchor="start" font-size="11" fill="#2f8a55">⚠ 情绪【不改变相位】，</text>
<text x="150.0" y="386.0" text-anchor="start" font-size="11" fill="#2f8a55">只影响报告与日报</text>
<line x1="820.0" y1="351.0" x2="820.0" y2="400.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M820.0,405.0 L935.0,445.0 L820.0,485.0 L705.0,445.0 Z" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/>
<text x="820.0" y="445.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">risk_lvl == high ?</text>
<line x1="705.0" y1="445.0" x2="330.0" y2="445.0" stroke="#b03a3a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="135.0" y="408.0" width="330.0" height="74.0" rx="9" fill="#e8f1fd" stroke="#3a6ea5" stroke-width="1.5"/><text x="300.0" y="426.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">否：调用 complete() 生成回复</text><text x="300.0" y="445.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">相位按【轮次 / 时长】推进</text><text x="300.0" y="464.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">watch 仅标记，不升级</text>
<line x1="820.0" y1="485.0" x2="820.0" y2="528.0" stroke="#b03a3a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="650.0" y="528.0" width="340.0" height="84.0" rx="9" fill="#fdeaea" stroke="#b03a3a" stroke-width="1.5"/><text x="820.0" y="551.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">是：相位 = CRISIS</text><text x="820.0" y="570.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">返回固定危机话术 + 热线</text><text x="820.0" y="589.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">不再调用生成；should_finish=true</text>
<text x="660.0" y="545.0" text-anchor="end" font-size="11" fill="#b03a3a">实测 2 次：V2 轮2、V3 轮1</text>
<line x1="300.0" y1="482.0" x2="300.0" y2="620.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="85.0" y="620.0" width="430.0" height="70.0" rx="9" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/><text x="300.0" y="645.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">轮次 ≥ 4（MAX_TURNS）或 已用 ≥ 240s</text><text x="300.0" y="664.5" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">→ MAIN → CLOSING → DONE</text>
<text x="540.0" y="640.0" text-anchor="start" font-size="11" fill="#b08900">实测：V1 由 1088s 超时触发；</text>
<text x="540.0" y="654.0" text-anchor="start" font-size="11" fill="#b08900">V4 由轮次 4 触发</text>
<line x1="300.0" y1="690.0" x2="560.0" y2="690.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="820.0" y1="612.0" x2="820.0" y2="660.0" stroke="#666" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="820.0" y1="660.0" x2="600.0" y2="690.0" stroke="#b03a3a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="530.0" y="700.0" width="300.0" height="52.0" rx="9" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5"/><text x="680.0" y="726.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1a1a1a">POST /companion/{sid}/finish 落库</text>
<text x="560.0" y="742.0" text-anchor="end" font-size="11" fill="#777">同日合并取最高等级 → #130 保留 high</text>
</svg>